{% extends "taskmanager/base.html" %}

{% block title %}Edit Task | Hangarin{% endblock %}

{% block content %}

<div class="page-heading">

    <a href="{% url 'task_detail' task.id %}" class="back-link">
        ← Back to Task
    </a>

    <h2>Edit Task 🌷</h2>

    <p>Make changes to your task below.</p>

</div>


<div class="form-card">

    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label>Task Title</label>

            <input
                type="text"
                name="title"
                value="{{ task.title }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Description</label>

            <textarea
                name="description"
                required
            >{{ task.description }}</textarea>

        </div>


        <div class="form-group">

            <label>Deadline</label>

            <input
                type="datetime-local"
                name="deadline"
                value="{{ task.deadline|date:'Y-m-d\TH:i' }}"
                required
            >

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>Status</label>

                <select name="status">

                    <option
                        value="Pending"
                        {% if task.status == "Pending" %}selected{% endif %}
                    >
                        Pending
                    </option>

                    <option
                        value="In Progress"
                        {% if task.status == "In Progress" %}selected{% endif %}
                    >
                        In Progress
                    </option>

                    <option
                        value="Completed"
                        {% if task.status == "Completed" %}selected{% endif %}
                    >
                        Completed
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Category</label>

                <select name="category">

                    {% for category in categories %}

                        <option
                            value="{{ category.id }}"
                            {% if task.category.id == category.id %}selected{% endif %}
                        >
                            {{ category.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label>Priority</label>

                <select name="priority">

                    {% for priority in priorities %}

                        <option
                            value="{{ priority.id }}"
                            {% if task.priority.id == priority.id %}selected{% endif %}
                        >
                            {{ priority.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{% url 'task_detail' task.id %}"
                class="cancel-button"
            >
                Cancel
            </a>

            <button type="submit" class="save-button">
                Save Changes
            </button>

        </div>

    </form>

</div>

{% endblock %}
