{% extends "taskmanager/base.html" %}

{% block title %}Delete Task | Hangarin{% endblock %}

{% block content %}

<div class="page-heading">

    <a href="{% url 'task_detail' task.id %}" class="back-link">
        ← Back to Task
    </a>

    <h2>Delete Task 🌷</h2>

    <p>Are you sure you want to delete this task?</p>

</div>


<div class="delete-card">

    <div class="delete-icon">
        🗑️
    </div>

    <h3>{{ task.title }}</h3>

    <p>
        This action cannot be undone.
    </p>


    <form method="POST">

        {% csrf_token %}

        <div class="form-actions">

            <a
                href="{% url 'task_detail' task.id %}"
                class="cancel-button"
            >
                Keep Task
            </a>

            <button type="submit" class="delete-confirm-button">
                Yes, Delete
            </button>

        </div>

    </form>

</div>

{% endblock %}
