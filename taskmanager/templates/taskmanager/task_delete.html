{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Hangarin - Delete Task</title>
    <link rel="stylesheet" href="{% static 'taskmanager/style.css' %}">
</head>
<body>

    <a href="{% url 'task_list' %}">All Tasks</a>

    <hr>

    <h1>Delete Task</h1>

    <p>Are you sure you want to delete this task?</p>

    <h2>{{ task.title }}</h2>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete Task</button>
    </form>

    <br>

    <a href="{% url 'task_detail' task.id %}">Cancel</a>

</body>
</html>
