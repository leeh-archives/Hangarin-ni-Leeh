{% load socialaccount %}
{% if google_enabled or github_enabled %}

    <div class="social-divider"><span>or continue with</span></div>

    <div class="social-buttons">

        {% if google_enabled %}
            <form method="POST" action="{% provider_login_url 'google' process='login' %}">
                {% csrf_token %}
                <button type="submit" class="social-button">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.45a5.5 5.5 0 0 1-2.39 3.62v3h3.87c2.27-2.09 3.57-5.17 3.57-8.81z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.87-3A7.2 7.2 0 0 1 12 19.2c-3.13 0-5.78-2.11-6.73-4.96H1.27v3.1A12 12 0 0 0 12 24z"/>
                        <path fill="#FBBC05" d="M5.27 14.24A7.2 7.2 0 0 1 4.9 12c0-.78.14-1.53.37-2.24v-3.1H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.34l4-3.1z"/>
                        <path fill="#EA4335" d="M12 4.8c1.77 0 3.35.61 4.6 1.8l3.43-3.43C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.66l4 3.1C6.22 6.91 8.87 4.8 12 4.8z"/>
                    </svg>
                    <span>Google</span>
                </button>
            </form>
        {% endif %}

        {% if github_enabled %}
            <form method="POST" action="{% provider_login_url 'github' process='login' %}">
                {% csrf_token %}
                <button type="submit" class="social-button">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path fill="#24292f" d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.75.11 3.04.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/>
                    </svg>
                    <span>GitHub</span>
                </button>
            </form>
        {% endif %}

    </div>

{% endif %}
