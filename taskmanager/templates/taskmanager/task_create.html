{% extends "taskmanager/base.html" %}

{% block title %}Add Task | Hangarin{% endblock %}

{% block content %}

<div class="page-heading">

    <a href="{% url 'task_list' %}" class="back-link">
        ← Back to Tasks
    </a>

    <h2>Add a New Task 🌷</h2>

    <p>Create something you want to accomplish.</p>

</div>


<div class="form-card">

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>Task Title</label>

            <input
                type="text"
                name="title"
                placeholder="What do you need to do?"
                required
            >

        </div>


        <div class="form-group">

            <label>Description</label>

            <textarea
                name="description"
                placeholder="Add some details about your task..."
                required
            ></textarea>

        </div>


        <div class="form-group">

            <label>Deadline</label>

            <input
                type="datetime-local"
                name="deadline"
                required
            >

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>Status</label>

                <select name="status">

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Category</label>

                <select name="category">

                    {% for category in categories %}

                        <option value="{{ category.id }}">
                            {{ category.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label>Priority</label>

                <select name="priority">

                    {% for priority in priorities %}

                        <option value="{{ priority.id }}">
                            {{ priority.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{% url 'task_list' %}"
                class="cancel-button"
            >
                Cancel
            </a>

            <button type="submit" class="save-button">
                Create Task 🌸
            </button>

        </div>

    </form>

</div>

{% endblock %}
